name: CI/CD — MotoTrack Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/saas-track-org/track-front

jobs:

  # ── 1. Build ─────────────────────────────────────────────────────────────
  test:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

  # ── 2. Build & Push ─────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.TAG }}
          build-args: |
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}

  # ── 3. Health Check — sobe serviços se necessário ───────────────────────────
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: secret-front
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Verifica e recupera instância
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mototrack

            echo "=== Status atual ==="
            docker compose ps

            echo "=== Verificando Postgres ==="
            POSTGRES_STATUS=$(docker inspect --format='{{.State.Health.Status}}' mototrack-postgres 2>/dev/null || echo "not_running")
            echo "Postgres: $POSTGRES_STATUS"
            if [ "$POSTGRES_STATUS" != "healthy" ]; then
              echo "⚠ Postgres fora — subindo..."
              docker compose up -d postgres
              sleep 10
            fi

            echo "=== Verificando Nginx ==="
            NGINX_RUNNING=$(docker inspect --format='{{.State.Running}}' mototrack-nginx 2>/dev/null || echo "false")
            echo "Nginx running: $NGINX_RUNNING"
            if [ "$NGINX_RUNNING" != "true" ]; then
              echo "⚠ Nginx fora — subindo..."
              docker compose up -d nginx
              sleep 5
            fi

            echo "=== Verificando HTTPS ==="
            HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" https://traccks.duckdns.org || echo "000")
            echo "HTTPS response: $HTTP_CODE"

            echo "=== Disco ==="
            df -h /

            echo "=== Memória ==="
            free -m

            echo "=== Status final ==="
            docker compose ps

  # ── 4. Deploy ───────────────────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: health-check
    environment: secret-front
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Set image tag
        id: tag
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/mototrack
            sed -i "s/^FRONTEND_IMAGE_TAG=.*/FRONTEND_IMAGE_TAG=${{ steps.tag.outputs.TAG }}/" .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull frontend
            docker compose up -d --no-deps frontend
            docker image prune -f